name: Build Universal ChessHub APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build Universal Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Build Universal Release APK (Unsigned / Signed if secrets set)
        run: ./gradlew :app:assembleRelease
        continue-on-error: true

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChessHub-Universal-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Publish Direct APK Release (on tag push or manual release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
