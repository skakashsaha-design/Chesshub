name: Build ChessHub APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check project
        run: |
          echo "===== Project ====="
          ls -la

          echo "===== App ====="
          ls -la app || true

          echo "===== Gradle ====="
          gradle --version

          echo "===== Java ====="
          java -version

      - name: Clean project
        run: gradle clean

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Verify debug keystore
        run: |
          echo "===== Debug Keystore ====="
          ls -lh "$GITHUB_WORKSPACE/debug.keystore"

          echo "===== Keystore Details ====="
          keytool -list \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest
        continue-on-error: true

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Build Release APK
        run: gradle :app:assembleRelease
        continue-on-error: true

      - name: Prepare APK
        run: |
          mkdir -p release

          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk \
              release/ChessHub-universal-v1.0.0.apk
          else
            echo "Debug APK was not created!"
            exit 1
          fi

          echo "===== APK files ====="
          find app/build/outputs -name "*.apk" -type f -print

          echo "===== Release folder ====="
          ls -lh release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessHub-Universal-APK
          path: |
            release/*.apk
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/ChessHub-universal-v1.0.0.apk
          generate_release_notes: true