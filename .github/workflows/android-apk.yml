name: Build ChessHub APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check project
        run: |
          echo "===== Project ====="
          ls -la
          echo "===== App ====="
          ls -la app || true
          echo "===== Gradle ====="
          gradle --version

      - name: Clean project
        run: gradle clean

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest
             continue-on-error: true

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Build Release APK
        run: gradle :app:assembleRelease
        continue-on-error: true

      - name: Prepare APK
        run: |
          mkdir -p release

          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk \
              release/ChessHub-universal-v1.0.0.apk
          else
            echo "Debug APK was not created!"
            exit 1
          fi

          echo "===== APK files ====="
          find app/build/outputs -name "*.apk" -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessHub-Universal-APK
          path: |
            release/*.apk
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/ChessHub-universal-v1.0.0.apk
          generate_release_notes: true