name: Build Universal ChessHub APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Fix permission for Gradle Wrapper
      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      # Check that Gradle works
      - name: Check Gradle
        run: ./gradlew --version

      # Run tests
      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      # Build Debug APK
      - name: Build Universal Debug APK
        run: ./gradlew :app:assembleDebug

      # Build Release APK
      - name: Build Universal Release APK
        run: ./gradlew :app:assembleRelease
        continue-on-error: true

      # Give the APK a simple name
      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk \
            release/ChessHub-universal-v1.0.0.apk

      # Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessHub-Universal-APK
          path: |
            release/ChessHub-universal-v1.0.0.apk
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      # Create GitHub Release when pushing a v1.0.0-style tag
      - name: Publish APK Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/ChessHub-universal-v1.0.0.apk
          generate_release_notes: true